<form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="container mx-auto">
  <header class="flex items-center justify-between ">
    <h1 class="text-2xl font-bold text-neutral font-montserrat">{{ product().title }}</h1>
    <div class="flex justify-end h-12">
      <button class="btn btn-neutral lg:w-45" type="submit">
        <!-- <span class="loading loading-spinner loading-sm"></span> -->

        Guardar
      </button>
    </div>
  </header>

  <div class="divider opacity-35"></div>

  <div class="flex flex-col lg:flex-row gap-12">
    <!-- Datos generales -->
    <div class="flex flex-col gap-2 px-4 grow lg:pl-8">
      <h2 class="text-2xl font-bold h-12 text-slate-800 font-montserrat">Datos generales</h2>
      <input type="text" placeholder="Título" class="input input-bordered w-full" formControlName="title"
        [class.border-red-600]="productForm.get('title')?.errors ?? false" />
      <form-error-label [control]="productForm.get('title')!" />

      <input type="text" placeholder="Slug" class="input input-bordered w-full" formControlName="slug"
        [class.border-red-600]="productForm.get('slug')?.errors ?? false" />
      <form-error-label [control]="productForm.get('slug')!" />

      <textarea class="textarea textarea-bordered w-full mt-2" placeholder="Descripción" rows="6"
        formControlName="description"
        [class.border-red-600]="productForm.get('description')?.errors ?? false"></textarea>
      <form-error-label [control]="productForm.get('description')!" />

      <h2 class="text-lg font-bold font-montserrat">Datos de venta</h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        <div>
          <input type="number" placeholder="Precio" class="input input-bordered w-full" formControlName="price"
            [class.border-red-600]="productForm.get('price')?.errors ?? false" />
          <form-error-label [control]="productForm.get('price')!" />
        </div>
        <div>
          <input type="number" placeholder="Inventario" class="input input-bordered w-full" formControlName="stock"
            [class.border-red-600]="productForm.get('stock')?.errors ?? false" />
          <form-error-label [control]="productForm.get('stock')!" />
        </div>
      </div>

      <!-- tags -->
      <input type="text" placeholder="Tags" class="input input-bordered w-full" formControlName="tags"
        [class.border-red-600]="productForm.get('tags')?.errors ?? false" />
      <form-error-label [control]="productForm.get('tags')!" />

      <!-- Botones para el género -->
      <div class="grid grid-cols-4 gap-2 mt-4">
        <!-- <button class="btn btn-sm btn-outline">Masculino</button> -->
        <button class="btn btn-sm" [class.btn-info]="productForm.value.gender === 'men'" type="button"
          (click)="productForm.patchValue({ gender: 'men' })">
          Masculino
        </button>
        <button class="btn btn-sm" [class.btn-secondary]="productForm.value.gender === 'women'" type="button"
          (click)="productForm.patchValue({ gender: 'women' })">
          Femenino
        </button>
        <button class="btn btn-sm" [class.btn-success]="productForm.value.gender === 'kid'" type="button"
          (click)="productForm.patchValue({ gender: 'kid' })">
          Kid
        </button>
        <button class="btn btn-sm" [class.btn-primary]="productForm.value.gender === 'unisex'" type="button"
          (click)="productForm.patchValue({ gender: 'unisex' })">
          Unisex
        </button>
      </div>

      <!-- Sizes -->
      <div class="grid grid-cols-6 gap-2 mt-4">
        @for (size of sizes; track size) {
        <button class="btn btn-sm" type="button" (click)="onSizeChange(size)"
          [class.btn-neutral]="productForm.value.sizes?.includes(size)">
          {{ size }}
        </button>
        }
      </div>
    </div>

    <!-- Imágenes -->
    <div class="flex flex-col gap-6 items-center 2xl:px-16">


      <product-carousel [images]="product().images" class="block min-w-0 w-full" />

      <input type="file" class="file-input file-input-bordered w-2/3 mt-4" />
    </div>
  </div>
</form>

@if (wasSaved()) {
  <div class="toast toast-top toast-center">
    <div class="alert alert-success text-white">
      <span>Datos guardados exitosamente</span>
    </div>
  </div>
}
