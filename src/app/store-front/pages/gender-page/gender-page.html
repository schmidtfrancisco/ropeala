<main class="py-6 px-2">
  <h1 class="text-3xl text-neutral font-montserrat font-bold">{{ gender() | titlecase}}</h1>
  <h2 class="text-xl mb-5 font-montserrat">Productos por categoría</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 mt-2 gap-3 lg:gap-8">
    @for (product of productsResource.value()?.products; track $index) {
    <product-card [product]="product" />
    }
    @empty {
    <p>No hay productos</p>
    }
  </div>
  <app-pagination [totalPages]="productsResource.value()?.pages ?? 0" [currentPage]="paginationService.currentPage()" />
</main>
