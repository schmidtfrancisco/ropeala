<h1 class="text-3xl font-montserrat text-secondary font-bold text-center mb-8">
  Registrarse
</h1>
<form class="flex flex-col gap-6 items-center justify-center" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
  <div class="flex flex-col w-full items-center justify-center">
    <label class="input input-lg w-full">
      <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="currentColor">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </g>
      </svg>
      <input type="text" required placeholder="Nombre y Apellido" minlength="3" formControlName="fullName" />
    </label>
  </div>
  <div class="flex flex-col w-full items-center justify-center">
    <label class="input input-lg w-full">
      <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="currentColor">
          <rect width="20" height="16" x="2" y="4" rx="2"></rect>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
        </g>
      </svg>
      <input type="email" placeholder="mail@site.com" required formControlName="email" />
    </label>
  </div>
  <div class="flex flex-col w-full items-center justify-center">
    <label class="input input-lg w-full">
      <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="currentColor">
          <path
            d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z">
          </path>
          <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle>
        </g>
      </svg>
      <input type="password" placeholder="Contraseña" minlength="6" formControlName="password" />
    </label>
  </div>
  <button type="submit" class="btn btn-primary w-full mt-6 flex gap-2" [disabled]="formRequestStatus().isLoading">
    @if (formRequestStatus().isLoading) {
      Cargando
      <span class="loading loading-spinner loading-md"></span>
    }
    @else {
      Registrarse
    }
  </button>
  <p>
    ¿Ya tienes cuenta?
    <a routerLink="/auth/login" class="link-neutral">Inicia sesión</a>
  </p>
</form>

@if (formRequestStatus().error) {
<div role="alert" class="alert alert-error animate-fade-in fixed bottom-5 right-5 w-52">
  <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
      d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
  </svg>
  <span>{{ formRequestStatus().error }}</span>
</div>
}
